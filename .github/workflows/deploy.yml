name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The lab gate needs the reference solutions, which are kept out of this
      # public repo (labs/_solutions/ is gitignored). Run it locally:
      #   python scripts/check-labs.py
      # Here we only check that every lab's Python parses.
      - name: lab files parse
        run: python -m py_compile labs/common/*.py labs/*/*.py

      # Generated-and-committed files: regenerate, so a stale manifest, agent
      # surface or lab zip fails the tests instead of 404ing in production.
      - name: regenerate manifest, lesson markdown and lab zips
        run: |
          npm run export
          python3 scripts/pack-labs.py

      - name: lint
        run: npm run lint

      - name: typecheck (src, tests, scripts)
        run: npm run typecheck

      # Project site: served from /trainingspace/, so the bundle and the router
      # basename must both know it (vite.config.ts reads VITE_BASE; main.tsx
      # passes import.meta.env.BASE_URL to the router).
      - name: build
        run: npm run build
        env:
          VITE_BASE: /trainingspace/

      # After the build on purpose: tests/bundle.test.ts inspects dist/.
      # tests/branding.test.ts is the branding gate.
      - name: test
        run: npm run test

      # Known routes get a real index.html (HTTP 200 for deep links); unknown
      # paths still fall back to 404.html and the router's not-found page.
      - run: node scripts/prepare-pages.mjs

      # Render real pages in headless Chrome: unit tests never execute the
      # browser bundle, and a runtime-only regex bug once blanked every lesson.
      - name: browser smoke test
        run: CHROMIUM_PATH=$(command -v google-chrome || command -v chromium) ./scripts/smoke.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
